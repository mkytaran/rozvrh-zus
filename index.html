<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rozvrh ZUŠ Kytara</title>
    <!-- Nativní řešení barvy lišty pro světlý i tmavý režim -->
    <meta name="theme-color" content="#f0f4f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
    <link rel="manifest" href="manifest.json?v=1.2">
    <link rel="stylesheet" href="style.css?v=1.2">
</head>
<body>
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 0.5rem;">
            <h1>Můj rozvrh</h1>
            <button id="btn-sync" style="background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 0;">🔄</button>
        </div>
        <div class="day-selector">
            <button data-day="Pondělí">Po</button>
            <button data-day="Úterý">Út</button>
            <button data-day="Středa">St</button>
            <button data-day="Čtvrtek">Čt</button>
            <button data-day="Pátek">Pá</button>
        </div>
    </header>
    
    <main id="schedule-container">
        <!-- Hodiny se generují zde -->
    </main>
    
    <div class="bottom-bar">
        <button id="add-lesson-btn">
            <span class="icon">➕</span> Hodina
        </button>
        <button id="add-break-btn">
            <span class="icon">☕</span> Přestávka
        </button>
    </div>

    <div id="edit-modal" class="modal-overlay hidden">
        <div class="modal">
            <h3>Úprava hodiny</h3>
            
            <div class="form-group">
                <label>Čas začátku</label>
                <input type="time" id="edit-time">
            </div>
            <div class="form-group">
                <label>Jméno žáka</label>
                <input type="text" id="edit-name">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Ročník</label>
                    <input type="text" id="edit-rocnik">
                </div>
                <div class="form-group">
                    <label>HN</label>
                    <input type="text" id="edit-hn">
                </div>
            </div>

            <div class="modal-actions">
                <button id="btn-save" class="btn-primary">Uložit</button>
                <button id="btn-cancel" class="btn-secondary">Zrušit</button>
            </div>
            <div class="modal-actions-danger">
                <button id="btn-swap" class="btn-outline">🔄 Vyměnit žáka</button>
                <button id="btn-delete" class="btn-danger">🗑 Smazat</button>
            </div>
        </div>
    </div>
    
    <script src="script.js?v=1.5"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
