<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rozvrh ZUŠ Kytara 2026</title>
    <meta name="theme-color" content="#121212" id="theme-color-meta">

    <!-- iOS Safari meta tagy -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rozvrh">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link rel="manifest" href="manifest.json?v=2.1">
    <link rel="stylesheet" href="style.css?v=3.5">
</head>
<body>
    <header>
        <!-- Horní lišta: Název, Dnes a synchronizace -->
        <div class="header-top">
            <h1>Můj rozvrh 2026</h1>
            <div class="header-actions">
                <button id="btn-today" class="btn-chip hidden" aria-label="Přejít na dnešek">Dnes</button>
                <button id="btn-sync" class="btn-icon" aria-label="Synchronizovat data" title="Synchronizovat">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
                        <path d="M16 21v-5h5"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Týdenní navigátor: šipky + klikací název otevírající kalendář -->
        <div class="week-stepper-container">
            <button id="week-prev" class="btn-nav" aria-label="Předchozí týden">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            
            <div id="week-trigger" class="week-display" role="button" tabindex="0" aria-label="Vybrat týden z kalendáře">
                <div class="week-title">
                    <span id="week-label-title">Tento týden</span>
                    <svg class="dropdown-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
                <div id="week-range-subtitle" class="week-range">14. 9. – 18. 9. 2026</div>
            </div>

            <button id="week-next" class="btn-nav" aria-label="Následující týden">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>

            <!-- Skrytý kalendář pro rychlý skok na libovolné datum -->
            <input type="date" id="native-date-picker" class="visually-hidden" tabindex="-1" aria-hidden="true">
        </div>

        <!-- Dny v týdnu (datum se doplňuje dynamicky) -->
        <nav class="day-selector" aria-label="Výběr dne v týdnu">
            <button data-day="Pondělí"><span class="tab-day-name">Po</span><span class="tab-day-date">-</span></button>
            <button data-day="Úterý"><span class="tab-day-name">Út</span><span class="tab-day-date">-</span></button>
            <button data-day="Středa"><span class="tab-day-name">St</span><span class="tab-day-date">-</span></button>
            <button data-day="Čtvrtek"><span class="tab-day-name">Čt</span><span class="tab-day-date">-</span></button>
            <button data-day="Pátek"><span class="tab-day-name">Pá</span><span class="tab-day-date">-</span></button>
        </nav>
    </header>
    
    <main id="schedule-container" role="region" aria-live="polite">
        <!-- Hodiny se generují zde -->
    </main>
    
    <div class="bottom-bar">
        <button id="add-lesson-btn">
            <span class="icon">➕</span> Hodina
        </button>
        <button id="add-break-btn">
            <span class="icon">☕</span> Přestávka
        </button>
    </div>

    <!-- Modální okno úprav -->
    <div id="edit-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
        <div class="modal">
            <h3>Úprava hodiny</h3>
            
            <div class="form-group">
                <label for="edit-time">Čas začátku</label>
                <input type="time" id="edit-time">
            </div>
            <div class="form-group">
                <label for="edit-name">Jméno žáka / Název hodiny</label>
                <input type="text" id="edit-name">
            </div>

            <!-- Výběr skupiny pro Kytarový soubor -->
            <div id="ensemble-group-selector" style="display: none; margin: 0.6rem 0; padding: 0.6rem; background: var(--tab-bg, #1a1e29); border-radius: 6px; border: 1px solid var(--border-card, #2a354d);">
                <label style="font-size: 0.85rem; color: var(--text-secondary, #94a3b8); font-weight: bold; display: block; margin-bottom: 0.4rem;">Skupina souboru:</label>
                <div style="display: flex; gap: 1rem;">
                    <label style="display: flex; align-items: center; gap: 0.4rem; color: #c084fc; cursor: pointer; font-size: 0.9rem; font-weight: bold;">
                        <input type="radio" name="ensemble-tier" value="younger" id="ensemble-younger" style="accent-color: #c084fc;">
                        Mladší
                    </label>
                    <label style="display: flex; align-items: center; gap: 0.4rem; color: #ffd166; cursor: pointer; font-size: 0.9rem; font-weight: bold;">
                        <input type="radio" name="ensemble-tier" value="older" id="ensemble-older" style="accent-color: #ffd166;">
                        Starší
                    </label>
                </div>
            </div>

            <!-- Přepínač pro soukromou hodinu -->
            <div style="margin: 0.4rem 0 0.8rem 0; display: flex; align-items: center; gap: 0.5rem;">
                <input type="checkbox" id="edit-private" style="width: 1.1rem; height: 1.1rem; accent-color: #3b82f6; cursor: pointer;">
                <label for="edit-private" style="cursor: pointer; font-size: 0.88rem; color: #60a5fa; font-weight: bold;">
                    🔒 Soukromá hodina (mimo systém)
                </label>
            </div>

            <!-- Standardní pole ZUŠ -->
            <div id="standard-zus-fields">
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-rocnik">Ročník</label>
                        <input type="text" id="edit-rocnik" placeholder="např. 2, 2. př, 5">
                    </div>
                    
                    <div class="form-group" id="group-hn">
                        <label for="edit-hn">HN</label>
                        <input type="text" id="edit-hn" placeholder="např. Po 14:30">
                    </div>
                </div>

                <div style="margin: 0.5rem 0 0.8rem 0;">
                    <label style="display: flex; align-items: center; gap: 0.6rem; cursor: pointer; color: #ffd166; font-size: 0.88rem; font-weight: 600;">
                        <input type="checkbox" id="edit-ensemble" style="width: 1.15rem; height: 1.15rem; accent-color: #ffd166; cursor: pointer;">
                        🎸 Kytarový soubor
                    </label>
                </div>
            </div>

            <!-- Pole pro Soukromou hodinu -->
            <div id="private-lesson-fields" style="display: none; margin: 0.6rem 0;">
                <label for="edit-notes" style="font-size: 0.85rem; color: #60a5fa; font-weight: bold;">Zápisník a poznámky k výuce:</label>
                <textarea id="edit-notes" rows="4" placeholder="Co probíráme, skladby, technika, úkoly, kontakt..." style="width: 100%; padding: 0.6rem; background: var(--input-bg, #181d28); color: var(--text-primary, #e2e8f0); border: 1px solid var(--input-border, #2d3d5a); border-radius: 6px; box-sizing: border-box; font-family: inherit; resize: vertical;"></textarea>
            </div>

            <!-- Omluvenka s datem -->
            <div style="margin: 0.8rem 0;">
                <div style="display: flex; align-items: center; gap: 0.6rem;">
                    <input type="checkbox" id="edit-absent" style="width: 1.2rem; height: 1.2rem; cursor: pointer;">
                    <label for="edit-absent" style="cursor: pointer; font-weight: bold;">Omluven / nepřijde</label>
                </div>
                <div id="absent-date-container" style="display: none; margin-top: 0.5rem; margin-left: 1.8rem;">
                    <label for="edit-absent-date" style="font-size: 0.8rem; color: var(--text-secondary, #aaa); display: block; margin-bottom: 0.2rem;">
                        Datum nebo rozsah (např. 15.9. nebo 10.9. - 24.9.):
                    </label>
                    <input type="text" id="edit-absent-date" placeholder="např. 15.9. nebo 10.9. - 24.9." 
                           style="width: 100%; padding: 0.45rem; background: var(--input-bg, #121212); color: var(--text-primary, #fff); border: 1px solid var(--input-border, #444); border-radius: 6px; box-sizing: border-box; font-size: 0.85rem;">
                </div>
            </div>

            <!-- Záskok -->
            <div id="substitute-section" style="margin: 0.8rem 0; padding: 0.8rem; background: var(--tab-bg, #1f242b); border-radius: 8px; border: 1px dashed var(--border-card, #3a4550);">
                <div style="font-weight: bold; margin-bottom: 0.5rem; color: #78a9ff; font-size: 0.9rem;">
                    ➕ Záskok na tuto hodinu
                </div>
                <label for="substitute-select" style="font-size: 0.8rem; color: var(--text-secondary, #888);">Vybrat ze stálých žáků:</label>
                <select id="substitute-select" style="width: 100%; padding: 0.5rem; margin-bottom: 0.6rem; background: var(--input-bg, #121212); color: var(--text-primary, white); border: 1px solid var(--input-border, #333); border-radius: 6px;"></select>

                <label for="substitute-custom" style="font-size: 0.8rem; color: var(--text-secondary, #888);">Nebo zadejte jiné jméno / činnost:</label>
                <input type="text" id="substitute-custom" placeholder="např. Příležitostný žák, Cvičení..." style="width: 100%; padding: 0.5rem; margin-bottom: 0.6rem; background: var(--input-bg, #121212); color: var(--text-primary, white); border: 1px solid var(--input-border, #333); border-radius: 6px; box-sizing: border-box;">

                <button type="button" id="btn-clear-sub" style="background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 6px; padding: 0.4rem 0.6rem; font-size: 0.8rem; cursor: pointer;">Zrušit záskok</button>
            </div>

            <div class="modal-actions">
                <button id="btn-save" class="btn-primary">Uložit</button>
                <button id="btn-cancel" class="btn-secondary">Zrušit</button>
            </div>
            <div class="modal-actions-danger">
                <button id="btn-swap" class="btn-outline">🔄 Vyměnit žáka</button>
                <button id="btn-delete" class="btn-danger">🗑 Smazat</button>
            </div>
        </div>
    </div>
    
    <script src="script.js?v=5.0"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js?v=2.1');
            });
        }
    </script>
</body>
</html>
