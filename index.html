<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rozvrh ZUŠ Kytara 2026</title>
    <meta name="theme-color" content="#121212" id="theme-color-meta">

    <!-- iOS Safari meta tagy -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rozvrh">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link rel="manifest" href="manifest.json?v=2.0">
    <link rel="stylesheet" href="style.css?v=2.7">
</head>
<body>
    <!-- Instalační banner pro Android i iOS -->
    <div id="pwa-install-banner" class="pwa-banner hidden">
        <div id="pwa-android-prompt" class="pwa-prompt-content hidden">
            <span>Nainstalovat aplikaci na plochu?</span>
            <button id="pwa-install-btn" class="pwa-action-btn">Instalovat</button>
            <button id="pwa-dismiss-btn" class="pwa-close-btn">&times;</button>
        </div>
        <div id="pwa-ios-prompt" class="pwa-prompt-content hidden">
            <span>Pro instalaci na iPhone klepněte na <strong>Sdílet</strong> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle;"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> a zvolte <strong>Přidat na plochu</strong>.</span>
            <button id="pwa-ios-dismiss-btn" class="pwa-close-btn">&times;</button>
        </div>
    </div>

    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 0.5rem;">
            <h1>Můj rozvrh 2026</h1>
            <button id="btn-sync" style="background: transparent; border: none; color: var(--text-color, inherit); cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center;" title="Synchronizovat">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                    <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
                    <path d="M16 21v-5h5"></path>
                </svg>
            </button>
        </div>
        <div class="day-selector">
            <button data-day="Pondělí">Po</button>
            <button data-day="Úterý">Út</button>
            <button data-day="Středa">St</button>
            <button data-day="Čtvrtek">Čt</button>
            <button data-day="Pátek">Pá</button>
        </div>
    </header>
    
    <main id="schedule-container">
        <!-- Hodiny se generují zde -->
    </main>
    
    <div class="bottom-bar">
        <button id="add-lesson-btn">
            <span class="icon">➕</span> Hodina
        </button>
        <button id="add-break-btn">
            <span class="icon">☕</span> Přestávka
        </button>
    </div>

    <!-- Modální okno úprav -->
    <div id="edit-modal" class="modal-overlay hidden">
        <div class="modal">
            <h3>Úprava hodiny</h3>
            
            <div class="form-group">
                <label>Čas začátku</label>
                <input type="time" id="edit-time">
            </div>
            <div class="form-group">
                <label>Jméno žáka / Název hodiny</label>
                <input type="text" id="edit-name">
            </div>

            <!-- Výběr skupiny pro Kytarový soubor -->
            <div id="ensemble-group-selector" style="display: none; margin: 0.6rem 0; padding: 0.6rem; background: #1a1e29; border-radius: 6px; border: 1px solid #2a354d;">
                <label style="font-size: 0.85rem; color: #94a3b8; font-weight: bold; display: block; margin-bottom: 0.4rem;">Skupina souboru:</label>
                <div style="display: flex; gap: 1rem;">
                    <label style="display: flex; align-items: center; gap: 0.4rem; color: #c084fc; cursor: pointer; font-size: 0.9rem; font-weight: bold;">
                        <input type="radio" name="ensemble-tier" value="younger" id="ensemble-younger" style="accent-color: #c084fc;">
                        Mladší
                    </label>
                    <label style="display: flex; align-items: center; gap: 0.4rem; color: #ffd166; cursor: pointer; font-size: 0.9rem; font-weight: bold;">
                        <input type="radio" name="ensemble-tier" value="older" id="ensemble-older" style="accent-color: #ffd166;">
                        Starší
                    </label>
                </div>
            </div>

            <!-- Přepínač pro soukromou hodinu -->
            <div style="margin: 0.4rem 0 0.8rem 0; display: flex; align-items: center; gap: 0.5rem;">
                <input type="checkbox" id="edit-private" style="width: 1.1rem; height: 1.1rem; accent-color: #3b82f6; cursor: pointer;">
                <label for="edit-private" style="cursor: pointer; font-size: 0.88rem; color: #93c5fd; font-weight: bold;">
                    🔒 Soukromá hodina (mimo systém)
                </label>
            </div>

            <!-- Standardní pole ZUŠ -->
            <div id="standard-zus-fields">
                <div class="form-row">
                    <div class="form-group">
                        <label>Ročník</label>
                        <input type="text" id="edit-rocnik" placeholder="např. 2, 2. př, 5">
                    </div>
                    
                    <div class="form-group" id="group-hn">
                        <label>HN</label>
                        <input type="text" id="edit-hn" placeholder="např. Po 14:30">
                    </div>
                </div>

                <div style="margin: 0.5rem 0 0.8rem 0;">
                    <label style="display: flex; align-items: center; gap: 0.6rem; cursor: pointer; color: #ffd166; font-size: 0.88rem;">
                        <input type="checkbox" id="edit-ensemble" style="width: 1.15rem; height: 1.15rem; accent-color: #ffd166; cursor: pointer;">
                        🎸 Kytarový soubor
                    </label>
                </div>
            </div>

            <!-- Pole pro Soukromou hodinu -->
            <div id="private-lesson-fields" style="display: none; margin: 0.6rem 0;">
                <label style="font-size: 0.85rem; color: #93c5fd; font-weight: bold;">Zápisník a poznámky k výuce:</label>
                <textarea id="edit-notes" rows="4" placeholder="Co probíráme, skladby, technika, úkoly, kontakt..." style="width: 100%; padding: 0.6rem; background: #181d28; color: #e2e8f0; border: 1px solid #2d3d5a; border-radius: 6px; box-sizing: border-box; font-family: inherit; resize: vertical;"></textarea>
            </div>

            <!-- Omluvenka s datem -->
            <div style="margin: 0.8rem 0;">
                <div style="display: flex; align-items: center; gap: 0.6rem;">
                    <input type="checkbox" id="edit-absent" style="width: 1.2rem; height: 1.2rem; cursor: pointer;">
                    <label for="edit-absent" style="cursor: pointer; font-weight: bold;">Omluven / nepřijde</label>
                </div>
                <div id="absent-date-container" style="display: none; margin-top: 0.5rem; margin-left: 1.8rem;">
                    <label for="edit-absent-date" style="font-size: 0.8rem; color: #aaa; display: block; margin-bottom: 0.2rem;">
                        Datum nebo rozsah (např. 15.9. nebo 10.9. - 24.9.):
                    </label>
                    <input type="text" id="edit-absent-date" placeholder="např. 15.9. nebo 10.9. - 24.9." 
                           style="width: 100%; padding: 0.45rem; background: #121212; color: #fff; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; font-size: 0.85rem;">
                </div>
            </div>

            <!-- Záskok -->
            <div id="substitute-section" style="margin: 0.8rem 0; padding: 0.8rem; background: #1f242b; border-radius: 8px; border: 1px dashed #3a4550;">
                <div style="font-weight: bold; margin-bottom: 0.5rem; color: #78a9ff; font-size: 0.9rem;">
                    ➕ Záskok na tuto hodinu
                </div>
                <label style="font-size: 0.8rem; color: #888;">Vybrat ze stálých žáků:</label>
                <select id="substitute-select" style="width: 100%; padding: 0.5rem; margin-bottom: 0.6rem; background: #121212; color: white; border: 1px solid #333; border-radius: 6px;"></select>

                <label style="font-size: 0.8rem; color: #888;">Nebo zadejte jiné jméno / činnost:</label>
                <input type="text" id="substitute-custom" placeholder="např. Příležitostný žák, Cvičení..." style="width: 100%; padding: 0.5rem; margin-bottom: 0.6rem; background: #121212; color: white; border: 1px solid #333; border-radius: 6px; box-sizing: border-box;">

                <button type="button" id="btn-clear-sub" style="background: #332222; color: #ff8888; border: 1px solid #553333; border-radius: 6px; padding: 0.4rem 0.6rem; font-size: 0.8rem; cursor: pointer;">Zrušit záskok</button>
            </div>

            <div class="modal-actions">
                <button id="btn-save" class="btn-primary">Uložit</button>
                <button id="btn-cancel" class="btn-secondary">Zrušit</button>
            </div>
            <div class="modal-actions-danger">
                <button id="btn-swap" class="btn-outline">🔄 Vyměnit žáka</button>
                <button id="btn-delete" class="btn-danger">🗑 Smazat</button>
            </div>
        </div>
    </div>
    
    <script src="script.js?v=4.3"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js?v=2.0');
            });
        }
    </script>
</body>
</html>
