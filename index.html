<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Michal – Rozvrh 2026/27</title>
    
    <!-- Výchozí systémová lišta pro korkový / tmavý režim -->
    <meta name="theme-color" content="#d8ba93" id="theme-color-meta">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default" id="apple-status-bar-meta">
    <meta name="apple-mobile-web-app-title" content="Rozvrh">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <script>
        (function() {
            var savedTheme = localStorage.getItem('zus_theme');
            var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = savedTheme || (systemDark ? 'dark' : 'light');
            
            document.documentElement.classList.add(theme === 'dark' ? 'theme-dark' : 'theme-light');
            var meta = document.getElementById('theme-color-meta');
            var appleMeta = document.getElementById('apple-status-bar-meta');
            
            if (theme === 'dark') {
                if (meta) meta.content = '#1e1c1a';
                if (appleMeta) appleMeta.content = 'black-translucent';
            } else {
                if (meta) meta.content = '#d8ba93';
                if (appleMeta) appleMeta.content = 'default';
            }
        })();
    </script>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>Michal – Rozvrh 2026/27</h1>
            <div class="header-actions">
                <button id="btn-today" class="btn-chip hidden" aria-label="Přejít na dnešek">Dnes</button>
                
                <!-- Tlačítko přepínání motivu -->
                <button id="btn-theme" class="btn-icon" aria-label="Přepnout motiv" title="Přepnout světlý korkový / tmavý motiv">
                    <svg id="icon-theme-sun" class="theme-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg id="icon-theme-moon" class="theme-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="week-stepper-container">
            <button id="week-prev" class="btn-nav" aria-label="Předchozí týden">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            
            <div id="week-trigger" class="week-display" role="button" tabindex="0" aria-label="Vybrat týden z kalendáře">
                <div class="week-title">
                    <span id="week-label-title">Tento týden</span>
                    <svg class="dropdown-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
                <div id="week-range-subtitle" class="week-range">--. --. – --. --. 2026</div>
            </div>

            <button id="week-next" class="btn-nav" aria-label="Následující týden">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>

            <input type="date" id="native-date-picker" class="visually-hidden" tabindex="-1" aria-hidden="true">
        </div>

        <nav class="day-selector" aria-label="Výběr dne v týdnu">
            <button data-day="Pondělí">
                <span class="tab-day-name">Po</span>
                <span class="tab-day-date">-</span>
                <span class="day-dots-container"></span>
            </button>
            <button data-day="Úterý">
                <span class="tab-day-name">Út</span>
                <span class="tab-day-date">-</span>
                <span class="day-dots-container"></span>
            </button>
            <button data-day="Středa">
                <span class="tab-day-name">St</span>
                <span class="tab-day-date">-</span>
                <span class="day-dots-container"></span>
            </button>
            <button data-day="Čtvrtek">
                <span class="tab-day-name">Čt</span>
                <span class="tab-day-date">-</span>
                <span class="day-dots-container"></span>
            </button>
            <button data-day="Pátek">
                <span class="tab-day-name">Pá</span>
                <span class="tab-day-date">-</span>
                <span class="day-dots-container"></span>
            </button>
        </nav>
    </header>
    
    <main id="schedule-container" role="region" aria-live="polite">
    </main>
    
    <div class="bottom-bar">
        <button id="add-lesson-btn"><span class="icon">➕</span> Hodina</button>
        <button id="add-event-btn"><span class="icon">🗓️</span> Událost</button>
        <button id="add-break-btn"><span class="icon">☕</span> Přestávka</button>
    </div>

    <div id="edit-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
        <div class="modal">
            <div id="modal-type-switcher" class="type-switcher">
                <button type="button" id="type-btn-lesson" class="type-btn active">Výuka žáka</button>
                <button type="button" id="type-btn-event" class="type-btn">Pracovní událost</button>
            </div>

            <div class="form-group" id="group-day-select">
                <label for="edit-day">Den v týdnu</label>
                <select id="edit-day">
                    <option value="Pondělí">Pondělí</option>
                    <option value="Úterý">Úterý</option>
                    <option value="Středa">Středa</option>
                    <option value="Čtvrtek">Čtvrtek</option>
                    <option value="Pátek">Pátek</option>
                </select>
            </div>

            <div class="form-group" id="group-event-date" style="display: none;">
                <label for="edit-event-date">Datum akce</label>
                <input type="date" id="edit-event-date">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="edit-time">Začátek</label>
                    <input type="time" id="edit-time">
                </div>
                <div class="form-group" id="group-end-time" style="display: none;">
                    <label for="edit-event-end">Konec akce</label>
                    <input type="time" id="edit-event-end">
                </div>
            </div>

            <div class="form-group">
                <label for="edit-name" id="label-edit-name">Jméno žáka / Název hodiny</label>
                <input type="text" id="edit-name">
            </div>

            <div id="event-specific-fields" class="event-tier-box" style="display: none;">
                <label class="form-sublabel">Druh pracovní události:</label>
                <div class="radio-row">
                    <label class="radio-tag event-concert-tag">
                        <input type="radio" name="event-kind" value="concert" id="event-concert" checked>
                        🎻 Koncert / Vystoupení
                    </label>
                    <label class="radio-tag event-meeting-tag">
                        <input type="radio" name="event-kind" value="meeting" id="event-meeting">
                        📋 Porada / Školení
                    </label>
                </div>
            </div>

            <div id="ensemble-group-selector" class="ensemble-tier-box" style="display: none;">
                <label class="form-sublabel">Skupina souboru:</label>
                <div class="radio-row">
                    <label class="radio-tag younger">
                        <input type="radio" name="ensemble-tier" value="younger" id="ensemble-younger">
                        Mladší
                    </label>
                    <label class="radio-tag older">
                        <input type="radio" name="ensemble-tier" value="older" id="ensemble-older">
                        Starší
                    </label>
                </div>
            </div>

            <div class="checkbox-row" id="row-private-toggle">
                <input type="checkbox" id="edit-private">
                <label for="edit-private" class="label-private">🔒 Soukromá hodina (mimo systém ZUŠ)</label>
            </div>

            <div id="standard-zus-fields">
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-rocnik">Ročník</label>
                        <input type="text" id="edit-rocnik" placeholder="např. 2, 2. př, 5">
                    </div>
                    <div class="form-group" id="group-hn">
                        <label for="edit-hn">HN</label>
                        <input type="text" id="edit-hn" placeholder="např. Po 14:30">
                    </div>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="edit-ensemble">
                    <label for="edit-ensemble" class="label-ensemble">🎸 Kytarový soubor</label>
                </div>
            </div>

            <div id="private-lesson-fields">
                <label for="edit-notes" id="label-edit-notes" class="form-sublabel">Zápisník a poznámky k výuce:</label>
                <textarea id="edit-notes" rows="4" placeholder="Skladby, cvičení, program, kontakt..."></textarea>
            </div>

            <div class="absence-section" id="row-absent-section">
                <div class="checkbox-row">
                    <input type="checkbox" id="edit-absent">
                    <label for="edit-absent"><strong>Omluven / nepřijde</strong></label>
                </div>
                
                <div id="absent-date-container" style="display: none; margin-top: 0.6rem; background: var(--tab-bg); border: 1px solid var(--border-card); padding: 0.75rem; border-radius: 8px;">
                    <div class="form-row">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="edit-absent-from" class="form-sublabel">Datum od:</label>
                            <input type="date" id="edit-absent-from">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="edit-absent-to" class="form-sublabel">Datum do (volitelné):</label>
                            <input type="date" id="edit-absent-to">
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 0.4rem; margin-top: 0.6rem;">
                        <button type="button" id="btn-absent-quick-today" class="history-chip" style="flex: 1;">Pouze dnes</button>
                        <button type="button" id="btn-absent-quick-week" class="history-chip" style="flex: 1;">Celý týden</button>
                    </div>

                    <input type="hidden" id="edit-absent-date">
                </div>
            </div>

            <div id="substitute-section" class="substitute-box" style="display: none;">
                <div class="substitute-box-title">Záskok na tuto hodinu</div>
                
                <div class="form-group" style="margin-bottom: 0.6rem;">
                    <label for="substitute-select" class="form-sublabel">Vybrat ze stálých žáků:</label>
                    <select id="substitute-select" class="substitute-input"></select>
                </div>

                <div class="substitute-divider"><span>nebo</span></div>

                <div class="form-group" style="margin-bottom: 0.5rem;">
                    <label for="substitute-custom" class="form-sublabel">Zadat jiné jméno / činnost:</label>
                    <input type="text" id="substitute-custom" class="substitute-input" placeholder="např. Jan Novák, Samostudium, Cvičení...">
                </div>

                <button type="button" id="btn-clear-sub" class="btn-clear-sub">Zrušit záskok</button>
            </div>

            <div class="modal-actions">
                <button id="btn-save" class="btn-primary">Uložit</button>
                <button id="btn-cancel" class="btn-secondary">Zrušit</button>
            </div>
            <div class="modal-actions-danger">
                <button id="btn-swap" class="btn-outline">🔄 Vyměnit žáka</button>
                <button id="btn-delete" class="btn-danger">🗑 Smazat</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then((reg) => {
                    reg.update();
                });
            });

            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        }
    </script>
</body>
</html>
