<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rozvrh ZUŠ Kytara</title>
    <meta name="theme-color" content="#f4f6f8" id="theme-color-meta">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=1.1">
</head>
<body>
    <header>
        <h1>Můj rozvrh</h1>
        <div class="day-selector">
            <button data-day="Pondělí">Po</button>
            <button data-day="Úterý">Út</button>
            <button data-day="Středa">St</button>
            <button data-day="Čtvrtek">Čt</button>
            <button data-day="Pátek">Pá</button>
        </div>
    </header>
    
    <main id="schedule-container">
        <!-- Hodiny se generují zde -->
    </main>
    
    <div class="bottom-bar">
        <button id="add-lesson-btn">➕ Hodina</button>
        <button id="add-break-btn">☕ Přestávka</button>
    </div>
    
    <script src="script.js?v=1.1"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
