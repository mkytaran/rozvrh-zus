<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Generátor Ikony z Fotky</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: #fff; padding: 20px; }
        canvas { border: 2px solid #555; margin: 10px; cursor: pointer; border-radius: 10px; background: #333; }
        canvas:hover { border-color: #66b3ff; box-shadow: 0 0 15px rgba(102,179,255,0.4); }
        input[type="file"] { padding: 10px; font-size: 1.1em; cursor: pointer; background: #444; color: white; border-radius: 6px; border: 1px solid #666;}
        .hint { color: #aaa; margin-bottom: 20px; line-height: 1.5; }
    </style>
</head>
<body>
    <h2>Vyrob si ikonu z vlastní fotky</h2>
    <p class="hint">
        1. Klikni na tlačítko níže a vyber fotku kytary, kterou sis stáhl.<br>
        2. Prohlížeč ji automaticky ořízne do kruhu a upraví do správných velikostí pro PWA.<br>
        3. Klikni na vygenerované obrázky a ony se ti stáhnou.
    </p>
    
    <input type="file" id="upload" accept="image/*">
    <br><br>
    
    <!-- Zde se vykreslí ikony -->
    <canvas id="c192" width="192" height="192" title="Klikni pro stažení icon-192.png"></canvas>
    <canvas id="c512" width="512" height="512" title="Klikni pro stažení icon-512.png"></canvas>

    <script>
        const upload = document.getElementById('upload');
        const canvases = [
            { id: 'c192', size: 192 },
            { id: 'c512', size: 512 }
        ];

        upload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const img = new Image();
            img.onload = () => {
                canvases.forEach(c => {
                    const canvas = document.getElementById(c.id);
                    const ctx = canvas.getContext('2d');
                    const size = c.size;
                    const cx = size / 2;

                    ctx.clearRect(0, 0, size, size);

                    // 1. Modré pozadí (vyplní průhledná místa, pokud stáhneš PNG)
                    ctx.fillStyle = '#2b2b2b';
                    ctx.beginPath();
                    ctx.arc(cx, cx, cx, 0, Math.PI * 2);
                    ctx.fill();

                    // 2. Oříznutí dalšího kreslení do kruhu
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(cx, cx, cx, 0, Math.PI * 2);
                    ctx.clip();

                    // 3. Výpočet ořezu (aby fotka vyplnila celý kruh bez deformace)
                    const scale = Math.max(size / img.width, size / img.height);
                    const w = img.width * scale;
                    const h = img.height * scale;
                    const x = (size - w) / 2;
                    const y = (size - h) / 2;

                    // 4. Vykreslení samotné fotky
                    ctx.drawImage(img, x, y, w, h);
                    ctx.restore();

                    // 5. Zpřístupnění stažení po kliknutí
                    canvas.onclick = () => {
                        const a = document.createElement('a');
                        a.href = canvas.toDataURL('image/png');
                        a.download = `icon-${size}.png`;
                        a.click();
                    };
                });
            };
            // Načtení lokálního souboru přímo v prohlížeči
            img.src = URL.createObjectURL(file);
        });
    </script>
</body>
</html>
