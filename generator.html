<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Generátor ikon</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #eee; padding: 20px; }
        canvas { border: 2px dashed #999; margin: 10px; cursor: pointer; }
        canvas:hover { border-color: #005bb5; }
    </style>
</head>
<body>
    <h2>Klikni na obrázky a ony se ti stáhnou jako PNG</h2>
    
    <canvas id="c192" width="192" height="192" title="Klikni pro stažení icon-192.png"></canvas>
    <canvas id="c512" width="512" height="512" title="Klikni pro stažení icon-512.png"></canvas>

    <script>
        function drawGuitar(id, size) {
            const canvas = document.getElementById(id);
            const ctx = canvas.getContext('2d');
            const cx = size / 2;

            // Tmavě modré pozadí (barva tvé aplikace)
            ctx.fillStyle = '#005bb5';
            ctx.beginPath();
            ctx.arc(cx, cx, cx, 0, Math.PI * 2);
            ctx.fill();

            const wood = '#dea568';
            const darkWood = '#542e17';
            const holeColor = '#2b160a';

            // Krk
            ctx.fillStyle = darkWood;
            ctx.fillRect(cx - size * 0.035, size * 0.2, size * 0.07, size * 0.3);

            // Hlava
            ctx.fillRect(cx - size * 0.05, size * 0.1, size * 0.1, size * 0.1);

            // Ladící kolíčky
            ctx.fillStyle = '#dcdcdc';
            [0.12, 0.15, 0.18].forEach(y => {
                ctx.beginPath(); ctx.arc(cx - size * 0.06, size * y, size * 0.015, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx + size * 0.06, size * y, size * 0.015, 0, Math.PI * 2); ctx.fill();
            });

            // Tělo horní
            ctx.fillStyle = wood;
            ctx.beginPath(); ctx.ellipse(cx, size * 0.5, size * 0.17, size * 0.12, 0, 0, Math.PI * 2); ctx.fill();

            // Tělo spodní
            ctx.beginPath(); ctx.ellipse(cx, size * 0.71, size * 0.22, size * 0.16, 0, 0, Math.PI * 2); ctx.fill();

            // Ozvučný otvor
            ctx.fillStyle = holeColor;
            ctx.beginPath(); ctx.arc(cx, size * 0.605, size * 0.075, 0, Math.PI * 2); ctx.fill();

            // Rozeta
            ctx.strokeStyle = '#b46432';
            ctx.lineWidth = Math.max(1, size * 0.005);
            ctx.beginPath(); ctx.arc(cx, size * 0.605, size * 0.085, 0, Math.PI * 2); ctx.stroke();

            // Kobylka
            ctx.fillStyle = darkWood;
            ctx.fillRect(cx - size * 0.08, size * 0.78, size * 0.16, size * 0.03);

            // Struny (3 nylonové + 3 kovové)
            for (let i = 0; i < 6; i++) {
                ctx.strokeStyle = i < 3 ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.4)';
                ctx.lineWidth = Math.max(1, size * 0.004);
                ctx.beginPath();
                let sx = cx - size * 0.025 + i * (size * 0.01);
                ctx.moveTo(sx, size * 0.15);
                ctx.lineTo(sx, size * 0.795);
                ctx.stroke();
            }

            // Funkce pro stažení obrázku po kliknutí
            canvas.onclick = () => {
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = `icon-${size}.png`;
                a.click();
            };
        }

        drawGuitar('c192', 192);
        drawGuitar('c512', 512);
    </script>
</body>
</html>
